<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Voltage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#140a22; --deep:#1b0f2c; --panel:#26163d; --panel2:#301b4c; --edge:#432766;
  --pink:#ff2f87; --cyan:#22e4ff; --lime:#b8ff3c; --sun:#ffb02e; --violet:#9d6bff;
  --ice:#f8effd; --dim:#b39ccb; --ok:#5ce27f; --bad:#ff5a5a;
  --tap:#0e0618;
  --display:"Bricolage Grotesque",Impact,"Arial Black",sans-serif;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  color:var(--ice);
  font-family:var(--ui);
  font-size:16px;line-height:1.45;
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 12% -6%, rgba(255,47,135,.20), transparent 60%),
    radial-gradient(800px 480px at 92% 4%, rgba(34,228,255,.16), transparent 62%),
    radial-gradient(700px 600px at 50% 108%, rgba(157,107,255,.20), transparent 60%);
  background-attachment:fixed;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:6px}
.hide{display:none !important}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;font-weight:800;line-height:.95}

/* ---------- layout ---------- */
#app{max-width:980px;margin:0 auto;padding:14px 14px 90px;position:relative;z-index:2}
.topbar{
  position:sticky;top:0;z-index:30;margin:-14px -14px 16px;padding:10px 14px;
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(to bottom,rgba(20,10,34,.96),rgba(20,10,34,.78) 70%,rgba(20,10,34,0));
  backdrop-filter:blur(8px);
}
.lvl{position:relative;width:46px;height:46px;flex:0 0 auto}
.lvl svg{transform:rotate(-90deg);display:block}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:17px}
.xpwrap{flex:1;min-width:0}
.xpline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--dim)}
.xpline b{font-family:var(--display);font-size:13px;color:var(--ice);letter-spacing:0}
.bar{height:9px;border-radius:99px;background:#2a1741;overflow:hidden;margin-top:4px;border:1px solid var(--edge)}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .5s cubic-bezier(.2,1.2,.3,1)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;
  background:var(--panel);border:1px solid var(--edge);font-size:13px;font-weight:600;white-space:nowrap
}
.chip b{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--panel);border:1px solid var(--edge);font-size:17px}
.iconbtn:active{transform:scale(.92)}

/* ---------- hero ---------- */
.hero{position:relative;padding:6px 2px 20px}
.hero h1{font-size:clamp(46px,13.5vw,104px);line-height:.82;text-transform:none}
.hero h1 span{display:block}
.hero .l2{color:transparent;-webkit-text-stroke:2px var(--pink);text-stroke:2px var(--pink)}
.hero p{max-width:34ch;color:var(--dim);margin:14px 0 0;font-size:15px}
.streakflame{position:absolute;right:0;top:6px;text-align:center;font-family:var(--display)}
.streakflame .n{font-size:40px;line-height:1;color:var(--sun)}
.streakflame .t{font-size:11px;color:var(--dim);font-family:var(--ui);letter-spacing:.02em}

/* ---------- game grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{
  position:relative;grid-column:span 2;min-height:118px;border-radius:var(--r);
  padding:12px;text-align:left;overflow:hidden;
  background:var(--panel);border:1px solid var(--edge);
  box-shadow:0 5px 0 rgba(0,0,0,.35);
  transition:transform .12s ease, box-shadow .12s ease;
  display:flex;flex-direction:column;justify-content:space-between;
}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tile .glyph{font-family:var(--display);font-size:34px;line-height:1}
.tile .nm{font-family:var(--display);font-size:20px;line-height:1;margin-top:auto}
.tile .sub{font-size:12px;color:var(--dim);margin-top:3px}
.tile .best{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.3)}
.tile.big{grid-column:span 4;min-height:132px}
.tile[data-c="pink"]{background:linear-gradient(150deg,#ff2f87,#c11d63);border-color:#ff7fb4;color:#1b0616}
.tile[data-c="cyan"]{background:linear-gradient(150deg,#22e4ff,#0e9fc4);border-color:#9df2ff;color:#04222a}
.tile[data-c="lime"]{background:linear-gradient(150deg,#b8ff3c,#7fc41a);border-color:#ddffa2;color:#152400}
.tile[data-c="sun"]{background:linear-gradient(150deg,#ffb02e,#e07c0a);border-color:#ffd894;color:#2a1500}
.tile[data-c="violet"]{background:linear-gradient(150deg,#9d6bff,#6a35d6);border-color:#cdb2ff;color:#170733}
.tile[data-c] .sub{color:rgba(0,0,0,.6)}
.tile[data-c] .best{background:rgba(0,0,0,.22);color:inherit}
.sect{font-family:var(--display);font-size:13px;color:var(--dim);margin:22px 0 10px;letter-spacing:.01em}

/* ---------- game view ---------- */
#view{animation:pop .22s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.ghead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ghead h2{font-size:26px;flex:1;min-width:0}
.back{padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);font-weight:700;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:7px 11px;min-width:64px}
.stat .k{font-size:10.5px;color:var(--dim);letter-spacing:.02em}
.stat .v{font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat.hot .v{color:var(--lime)}
.board{background:var(--deep);border:1px solid var(--edge);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.btn{
  padding:11px 16px;border-radius:13px;font-weight:700;background:var(--panel2);border:1px solid var(--edge);
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.go{background:linear-gradient(140deg,var(--lime),#86d417);color:#132200;border-color:#d7ff9a}
.btn.alt{background:linear-gradient(140deg,var(--cyan),#0fa8ce);color:#03222b;border-color:#a7f1ff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.muted{color:var(--dim);font-size:13px}
.big-msg{font-family:var(--display);font-size:22px;text-align:center;margin:10px 0 2px}

/* ---------- fx ---------- */
#fxc{position:fixed;inset:0;pointer-events:none;z-index:60}
#flash{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;transition:opacity .25s}
#toasts{position:fixed;left:0;right:0;bottom:16px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{
  font-family:var(--display);font-size:16px;padding:8px 16px;border-radius:99px;
  background:var(--panel2);border:1px solid var(--edge);box-shadow:0 6px 24px rgba(0,0,0,.5);
  animation:tin .3s cubic-bezier(.2,1.4,.4,1), tout .3s ease 1.25s forwards;
}
.toast.good{background:linear-gradient(120deg,var(--lime),#7fd414);color:#132200}
.toast.hot{background:linear-gradient(120deg,var(--pink),var(--sun));color:#2a0512}
.toast.bad{background:var(--bad);color:#2a0000}
@keyframes tin{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.95)}}
#combo{
  position:fixed;right:12px;top:64px;z-index:50;text-align:right;pointer-events:none;opacity:0;
  transition:opacity .2s;font-family:var(--display)
}
#combo.on{opacity:1}
#combo .x{font-size:38px;line-height:.9;color:var(--sun);text-shadow:0 0 18px rgba(255,176,46,.7)}
#combo .l{font-size:11px;color:var(--dim);font-family:var(--ui)}
#combo .cb{width:70px;height:6px;background:#2a1741;border-radius:9px;overflow:hidden;margin-top:4px;margin-left:auto}
#combo .cb i{display:block;height:100%;background:var(--sun);width:100%}
.shake{animation:shk .34s}
@keyframes shk{10%{transform:translate(-6px,2px) rotate(-.6deg)}30%{transform:translate(7px,-3px) rotate(.7deg)}50%{transform:translate(-5px,3px)}70%{transform:translate(4px,-2px)}100%{transform:none}}
.pulse{animation:pls .4s}
@keyframes pls{40%{transform:scale(1.08)}100%{transform:none}}
#levelup{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none;opacity:0
}
#levelup.on{animation:lu 1.5s forwards}
@keyframes lu{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
#levelup div{font-family:var(--display);font-size:clamp(40px,12vw,90px);text-align:center;color:var(--lime);text-shadow:0 0 40px rgba(184,255,60,.6)}
#levelup small{display:block;font-size:16px;color:var(--ice);font-family:var(--ui)}

/* ---------- word rush ---------- */
.wr{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;justify-content:center;margin-bottom:14px}
.wrow{display:grid;grid-template-columns:repeat(5,minmax(0,52px));gap:6px}
.cell{
  aspect-ratio:1;display:grid;place-items:center;border-radius:10px;border:2px solid var(--edge);
  background:var(--panel);font-family:var(--display);font-size:26px;text-transform:uppercase;
  transition:transform .12s;
}
.cell.f{border-color:var(--violet)}
.cell.g{background:var(--lime);border-color:var(--lime);color:#132200;animation:flip .4s}
.cell.y{background:var(--sun);border-color:var(--sun);color:#2a1500;animation:flip .4s}
.cell.n{background:#20122f;border-color:#20122f;color:var(--dim);animation:flip .4s}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg) scale(1.06)}100%{transform:rotateX(0)}}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center}
.kb .kr{display:flex;gap:4px}
.key{
  min-width:30px;height:46px;padding:0 7px;border-radius:9px;background:var(--panel2);border:1px solid var(--edge);
  font-weight:700;font-size:14px;display:grid;place-items:center;text-transform:uppercase
}
.key.wide{min-width:52px;font-size:12px}
.key:active{transform:translateY(2px)}
.key.g{background:var(--lime);color:#132200;border-color:var(--lime)}
.key.y{background:var(--sun);color:#2a1500;border-color:var(--sun)}
.key.n{background:#1a0f27;color:#6d5a85}

/* ---------- link up ---------- */
.lu{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.lt{
  min-height:68px;border-radius:11px;background:var(--panel2);border:1px solid var(--edge);
  display:grid;place-items:center;text-align:center;padding:4px;font-weight:700;font-size:clamp(10px,2.9vw,14px);
  line-height:1.1;word-break:break-word;transition:transform .1s
}
.lt.sel{background:var(--violet);border-color:#d3bcff;color:#150430;transform:scale(.96)}
.lt.wrong{animation:shk .34s}
.solved{border-radius:11px;padding:10px;text-align:center;grid-column:span 4;animation:pop .3s}
.solved .cat{font-family:var(--display);font-size:15px}
.solved .mem{font-size:12.5px;opacity:.82;margin-top:2px}
.s0{background:var(--sun);color:#2a1500}.s1{background:var(--lime);color:#142200}
.s2{background:var(--cyan);color:#042430}.s3{background:var(--pink);color:#2a0513}
.hearts{letter-spacing:3px;font-size:17px}

/* ---------- hive ---------- */
.hive{display:grid;place-items:center;margin:4px 0 14px}
.hexwrap{position:relative;width:228px;height:217px}
.hex{
  position:absolute;width:76px;height:87px;display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:var(--panel2);font-family:var(--display);font-size:30px;text-transform:uppercase;cursor:pointer;
  transition:transform .09s
}
.hex:active{transform:scale(.9)}
.hex.mid{background:var(--sun);color:#2a1500}
.hin{min-height:40px;text-align:center;font-family:var(--display);font-size:27px;letter-spacing:.04em;text-transform:uppercase;padding:6px 0}
.hin .no{color:#7d67a0}
.foundlist{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;max-height:112px;overflow:auto}
.fw{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--edge)}
.fw.pan{background:var(--sun);color:#2a1500;font-weight:700;border-color:var(--sun)}

/* ---------- word square ---------- */
.sq{display:grid;grid-template-columns:repeat(5,minmax(0,54px));gap:5px;justify-content:center;margin-bottom:14px}
.sc{
  aspect-ratio:1;border-radius:9px;background:var(--panel);border:2px solid var(--edge);
  display:grid;place-items:center;font-family:var(--display);font-size:24px;text-transform:uppercase
}
.sc.act{border-color:var(--lime);background:#2f2148}
.sc.cur{box-shadow:inset 0 -5px 0 var(--lime)}
.sc.mir{background:#231738;border-color:var(--violet)}
.sc.done{background:var(--lime);color:#132200;border-color:var(--lime)}
.clue{padding:9px 11px;border-radius:11px;background:var(--panel);border:1px solid var(--edge);margin-bottom:6px;font-size:14px;display:flex;gap:9px;align-items:center}
.clue.on{border-color:var(--lime);background:var(--panel2)}
.clue b{font-family:var(--display);color:var(--lime);font-size:15px}
.clue.got{opacity:.5}

/* ---------- sudoku ---------- */
.sud{display:grid;grid-template-columns:repeat(6,minmax(0,50px));gap:2px;justify-content:center;background:var(--edge);padding:3px;border-radius:12px}
.su{
  aspect-ratio:1;background:var(--panel);display:grid;place-items:center;
  font-family:var(--display);font-size:22px;border-radius:4px
}
.su.fix{background:#1c1029;color:var(--dim)}
.su.sel{background:var(--violet);color:#150430}
.su.peer{background:#33205088}
.su.err{background:var(--bad);color:#2a0000;animation:shk .3s}
.su.hit{animation:pls .4s}
.su.br{box-shadow:inset 0 -3px 0 var(--violet)}
.su.bc{box-shadow:inset -3px 0 0 var(--violet)}
.su.br.bc{box-shadow:inset 0 -3px 0 var(--violet),inset -3px 0 0 var(--violet)}
.numpad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.np{padding:12px 0;border-radius:11px;background:var(--panel2);border:1px solid var(--edge);font-family:var(--display);font-size:20px}
.np:active{transform:translateY(2px)}

/* ---------- crunch ---------- */
.target{text-align:center;margin-bottom:12px}
.target .t{font-family:var(--display);font-size:54px;line-height:1;color:var(--cyan);text-shadow:0 0 26px rgba(34,228,255,.45)}
.target .k{font-size:12px;color:var(--dim)}
.nums{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.num{
  width:60px;height:60px;border-radius:14px;background:var(--panel2);border:2px solid var(--edge);
  font-family:var(--display);font-size:24px;display:grid;place-items:center
}
.num.sel{background:var(--cyan);color:#042430;border-color:#a7f1ff;transform:scale(1.06)}
.num.used{opacity:.18;pointer-events:none}
.num.new{animation:pop .3s}
.ops{display:flex;gap:8px;justify-content:center}
.op{width:52px;height:52px;border-radius:13px;background:var(--panel);border:1px solid var(--edge);font-family:var(--display);font-size:24px}
.op.sel{background:var(--pink);color:#2a0513;border-color:#ffa8cc}

/* ---------- merge ---------- */
.mg{position:relative;width:min(340px,86vw);height:min(340px,86vw);margin:0 auto;background:#1c1029;border-radius:14px;padding:6px}
.mcell{position:absolute;display:grid;place-items:center;border-radius:10px;font-family:var(--display);transition:left .11s ease,top .11s ease;background:var(--panel2)}
.mcell.sp{animation:pop .18s}
.mcell.mrg{animation:pls .22s}
.swipe-hint{text-align:center;color:var(--dim);font-size:12.5px;margin-top:10px}

/* ---------- echo ---------- */
.echo{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(320px,80vw);margin:0 auto}
.pad{aspect-ratio:1;border-radius:18px;opacity:.42;transition:opacity .1s,transform .1s;border:2px solid rgba(255,255,255,.14)}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 34px currentColor}
.p0{background:var(--pink);color:var(--pink)}.p1{background:var(--cyan);color:var(--cyan)}
.p2{background:var(--lime);color:var(--lime)}.p3{background:var(--sun);color:var(--sun)}

/* ---------- pairs ---------- */
.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto}
.card{aspect-ratio:1;border-radius:12px;background:var(--panel2);border:1px solid var(--edge);display:grid;place-items:center;font-size:clamp(22px,7vw,32px);transform-style:preserve-3d;transition:transform .25s}
.card.face{background:var(--violet);transform:rotateY(180deg) scale(1)}
.card.face span{transform:rotateY(180deg)}
.card span{opacity:0;transition:opacity .1s .12s}
.card.face span,.card.done span{opacity:1}
.card.done{background:var(--lime);border-color:var(--lime)}

/* ---------- flash ---------- */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:0 auto}
.fc{aspect-ratio:1;border-radius:14px;background:var(--panel);border:1px solid var(--edge);display:grid;place-items:center;font-size:26px}
.fc.live{background:var(--lime);color:#132200;animation:pop .14s}
.fc.trap{background:var(--pink);color:#2a0513}
.timerbar{height:8px;border-radius:9px;background:#2a1741;overflow:hidden;margin-bottom:12px;border:1px solid var(--edge)}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));width:100%}

/* ---------- scramble ---------- */
.scram{font-family:var(--display);font-size:clamp(34px,10vw,56px);text-align:center;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 14px}
.scram span{display:inline-block;animation:pop .3s}
.ipt{
  width:100%;padding:13px 15px;border-radius:13px;background:var(--panel);border:2px solid var(--edge);
  color:var(--ice);font-family:var(--display);font-size:24px;text-align:center;text-transform:uppercase;letter-spacing:.06em
}
.ipt:focus{outline:none;border-color:var(--lime)}


/* ---------- fake scam popups ---------- */
#popups{position:fixed;inset:0;z-index:76;pointer-events:none}
.ad{position:absolute;width:min(300px,84vw);pointer-events:auto;border-radius:10px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.65);border:2px solid #0a0a0a;animation:adin .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes adin{from{opacity:0;transform:scale(.82)}}
.ad .bar{display:flex;align-items:center;gap:8px;padding:5px 7px;background:#d7dde6;color:#14141a;font-size:11px;font-weight:700}
.ad .site{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad .dots{color:#8a93a3;letter-spacing:-1px}
.ad .x{margin-left:auto;width:22px;height:20px;background:#c9302c;color:#fff;border-radius:3px;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.ad .body{padding:12px;color:#131317;cursor:pointer;text-align:center}
.ad .ico{font-size:34px;line-height:1;animation:wig 1.1s infinite}
@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.12)}}
.ad .t{font-family:var(--display);font-size:15px;line-height:1.05;margin:6px 0 4px}
.ad .l{font-size:11.5px;line-height:1.3;opacity:.85}
.ad .cta{margin-top:9px;background:#111;color:#ffe11a;font-family:var(--display);font-size:16px;padding:8px;border-radius:7px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:#2f2f2f;color:#fff}}
.ad .fine{font-size:9px;margin-top:6px;opacity:.6}
.toolbar{position:fixed;top:0;left:0;right:0;z-index:78;color:#14141a;font-size:11px;font-weight:700;padding:6px 10px;text-align:center;
  background:repeating-linear-gradient(90deg,#d7dde6,#d7dde6 12px,#c3cbd6 12px,#c3cbd6 24px)}
.virusbar{position:fixed;left:10px;right:10px;bottom:10px;z-index:79;background:#1a0510;border:2px solid var(--bad);
  border-radius:14px;padding:12px;text-align:center;box-shadow:0 0 50px rgba(255,90,90,.45)}
.virusbar .vt{font-family:var(--display);font-size:19px;color:var(--bad)}
.virusbar .vl{font-size:12px;color:var(--dim);margin:4px auto 9px;max-width:52ch}
.vlog{font-size:12.5px;color:var(--lime);margin-top:8px;font-weight:600}
body.virus #app{animation:glitch .3s infinite, skew 2.4s infinite}
@keyframes glitch{0%{filter:none}30%{filter:hue-rotate(40deg) saturate(1.5)}60%{filter:hue-rotate(-32deg) contrast(1.2)}100%{filter:none}}
@keyframes skew{0%,92%,100%{transform:none}94%{transform:translateX(-5px) skewX(1.6deg)}96%{transform:translateX(6px) skewX(-1.6deg)}}
body.virus::after{content:'';position:fixed;inset:0;z-index:74;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,0,80,.06) 0 2px,transparent 2px 5px)}


/* ---------- block drop ---------- */
.bd{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;max-width:378px;margin:0 auto;touch-action:manipulation}
.bdc{aspect-ratio:1;border-radius:6px;background:#241539;transition:background .1s,transform .1s}
.bdc.ghost{background:rgba(255,255,255,.22)}
.bdc.bad{background:rgba(255,90,90,.3)}
.trays{display:flex;gap:10px;justify-content:center;margin-top:14px}
.tray{padding:8px;border-radius:13px;background:var(--panel);border:2px solid var(--edge);min-width:88px;min-height:88px;display:grid;place-items:center}
.tray.sel{border-color:var(--lime);background:var(--panel2)}
.tray.dead{opacity:.32}
.mini{display:grid;gap:2px}
.mini i{width:14px;height:14px;border-radius:3px;display:block}

/* ---------- gem cascade ---------- */
.gems{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:400px;margin:0 auto}
.gem{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:clamp(13px,4vw,20px);
  border:0;transition:transform .1s;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.gem.sel{outline:3px solid var(--ice);transform:scale(.88)}
.gem.new{animation:pop .25s}
.gem.gone{animation:gone .18s forwards}
@keyframes gone{to{transform:scale(.2);opacity:0}}

/* ---------- bubble wrap ---------- */
.wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-width:420px;margin:0 auto;touch-action:none}
.bw{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 33% 28%,rgba(255,255,255,.9),#8fe0ff 42%,#2f8fb8);
  box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .1s,background .12s,box-shadow .12s}
.bw.pop{background:radial-gradient(circle at 50% 46%,#1b0f2b,#2a1842);box-shadow:inset 0 3px 7px rgba(0,0,0,.7);transform:scale(.82)}


/* ---------- juice layer ---------- */
#glow{position:fixed;inset:0;pointer-events:none;z-index:52;opacity:0;transition:opacity .35s;
  box-shadow:inset 0 0 110px 14px var(--gc,#9d6bff), inset 0 0 260px 50px var(--gc,#9d6bff)}
#glow.on{opacity:var(--gi,.4)}
#glow.beat{opacity:calc(var(--gi,.4) + .3);transition:opacity .05s}
#aurora{position:fixed;inset:-40%;z-index:0;pointer-events:none;opacity:0;transition:opacity .6s;
  background:conic-gradient(from 0deg,#ff2f8755,#22e4ff55,#b8ff3c55,#ffb02e55,#9d6bff55,#ff2f8755);
  filter:blur(80px);animation:swirl 30s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
body.hot #aurora{animation-duration:11s}
body.inferno #aurora{animation-duration:5s;filter:blur(60px) saturate(1.7)}
body.inferno .stat .v{text-shadow:0 0 14px currentColor}
.shock{position:fixed;z-index:53;pointer-events:none;border-radius:50%;border:3px solid;width:10px;height:10px;
  transform:translate(-50%,-50%);animation:shockw .6s ease-out forwards}
@keyframes shockw{from{width:10px;height:10px;opacity:.85}to{width:var(--sz,440px);height:var(--sz,440px);opacity:0;border-width:1px}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:72}
.float{position:fixed;font-family:var(--display);font-size:27px;white-space:nowrap;
  text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 22px currentColor;animation:flt 1.05s cubic-bezier(.12,.9,.25,1) forwards}
.float.big{font-size:42px}
@keyframes flt{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  18%{opacity:1;transform:translate(-50%,-64%) scale(1.3)}
  45%{transform:translate(-50%,-95%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-200%) scale(.95)}}
.coinfly{position:fixed;z-index:71;pointer-events:none;font-size:21px;transform:translate(-50%,-50%);
  transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),opacity .5s,transform .5s}
#rank{position:fixed;inset:0;display:grid;place-items:center;z-index:73;pointer-events:none}
#rank b{font-family:var(--display);font-size:clamp(44px,15vw,120px);opacity:0;letter-spacing:-.03em}
#rank.on b{animation:rankin .95s cubic-bezier(.1,1.5,.3,1) forwards}
@keyframes rankin{0%{opacity:0;transform:scale(.3) rotate(-9deg)}
  22%{opacity:1;transform:scale(1.14) rotate(3deg)}
  65%{opacity:1;transform:scale(1) rotate(0)}
  100%{opacity:0;transform:scale(1.45)}}
.punch{animation:pnch .24s}
@keyframes pnch{40%{transform:scale(1.018)}100%{transform:none}}
.chroma{animation:chrm .22s}
@keyframes chrm{0%,100%{filter:none}50%{filter:drop-shadow(3px 0 0 rgba(255,47,135,.85)) drop-shadow(-3px 0 0 rgba(34,228,255,.85)) saturate(1.3)}}
body.warp #app{animation:warp .9s}
@keyframes warp{0%{transform:scale(1)}14%{transform:scale(1.05);filter:brightness(1.7) saturate(1.6)}100%{transform:none;filter:none}}
#xpBar.surge{filter:brightness(1.6);box-shadow:0 0 16px var(--lime)}
#combo.kick .x{animation:pls .3s}
.tile .glyph{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.tile:nth-child(2n) .glyph{animation-delay:-1.2s}
.tile:nth-child(3n) .glyph{animation-delay:-2.4s}
.hero h1 span:first-child{background:linear-gradient(100deg,#fff 18%,#ffd9f0 38%,#9df4ff 54%,#fff 74%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}


/* ---------- shared new-game widgets ---------- */
.gg{display:grid;gap:6px}
.gc{display:grid;place-items:center;border-radius:10px;background:var(--panel2);border:1px solid var(--edge);
  font-family:var(--display);font-size:18px;cursor:pointer;user-select:none;transition:transform .08s,background .15s,color .15s}
.gc:active{transform:scale(.92)}
.gc.bulb{font-size:22px;background:#1d1230}
.gc.bulb.on{background:linear-gradient(180deg,#ffd07a,#ffb02e);box-shadow:0 0 18px #ffb02e88}
/* ladder */
.ldr{display:flex;gap:6px}
.ldc{width:46px;height:46px;display:grid;place-items:center;border-radius:10px;background:var(--panel2);
  border:2px solid var(--edge);font-family:var(--display);font-size:22px}
.ldr.start .ldc{border-color:var(--lime);color:var(--lime)}
.ldr.end .ldc{border-color:var(--pink);color:var(--pink)}
.ldr.ghost .ldc{opacity:.32;border-style:dashed}
.ldc.chg{background:var(--cyan);color:#10202a;border-color:var(--cyan)}
/* cryptogram */
.crw{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:14px}
.crword{display:flex;gap:3px}
.crcell{width:28px;text-align:center;cursor:pointer}
.crcell .cv{height:30px;display:grid;place-items:center;font-family:var(--display);font-size:20px;
  border-bottom:3px solid var(--edge);border-radius:3px}
.crcell .ck{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.08em}
.crcell.cur .cv{border-bottom-color:var(--pink);background:rgba(255,47,135,.14)}
.crcell.same .cv{background:rgba(34,228,255,.12)}
.crcell.ok .cv{color:var(--lime);border-bottom-color:var(--lime)}
.crtrack{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-bottom:10px}
.crt{width:20px;height:20px;display:grid;place-items:center;font-size:11px;border-radius:5px;background:var(--panel);color:var(--dim)}
.crt.used{background:var(--violet);color:#fff}
.crpad{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:16px 0 4px}
.crk{width:32px;height:38px;border-radius:8px;background:var(--panel2);border:1px solid var(--edge);font-weight:700}
.crk.wide{width:52px}
/* word search */
.wsg{display:grid;gap:2px;max-width:340px;margin:0 auto 12px;touch-action:none}
.wsc{aspect-ratio:1;display:grid;place-items:center;border-radius:5px;background:var(--panel2);
  font-family:var(--display);font-size:14px;user-select:none}
.wsc.sel{background:var(--cyan);color:#10202a}
.wsc.got{background:rgba(184,255,60,.28);color:var(--lime)}
.wslist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.wsw{padding:4px 9px;border-radius:99px;background:var(--panel);font-size:12px;font-weight:700;letter-spacing:.04em}
.wsw.got{background:var(--lime);color:#10200a;text-decoration:line-through}
/* typing */
.tyq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:70px}
.tyw{font-family:var(--display);font-size:20px;color:var(--dim);opacity:.6}
.tyw.cur{font-size:34px;color:var(--ice);opacity:1}
.tyw.cur .ok{color:var(--lime)} .tyw.cur .no{color:var(--bad);text-decoration:underline}
/* sweeper */
.swg{max-width:340px;margin:0 auto;gap:3px}
.gc.sw{aspect-ratio:1;font-size:15px;background:var(--panel2);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.gc.sw.open{background:#1a0f2a;box-shadow:none;cursor:default}
.gc.sw.boom{background:var(--bad)}
/* slide */
.slg{max-width:300px;margin:0 auto;gap:5px}
.gc.sl{aspect-ratio:1;font-size:24px;background:linear-gradient(180deg,#3a2159,#2a1741)}
.gc.sl.home{color:var(--lime)}
.gc.sl.hole{background:transparent;border-style:dashed;cursor:default}
/* code break */
.cbrows{display:flex;flex-direction:column;gap:6px;max-height:330px;overflow-y:auto;padding:4px}
.cbrow{display:flex;align-items:center;gap:10px;justify-content:center;padding:4px;border-radius:10px}
.cbrow.act{background:rgba(157,107,255,.14);outline:1px solid var(--edge)}
.cbpegs{display:flex;gap:6px}
.cbg{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:2px solid var(--edge);cursor:pointer}
.cbg.empty{background:transparent;border-style:dashed}
.cbfb{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:22px}
.cbd{width:9px;height:9px;border-radius:50%;background:var(--panel2)}
.cbd.ex{background:var(--lime)} .cbd.pa{background:var(--sun)}
.cbpal{display:flex;gap:8px;justify-content:center;margin-top:12px}
.cbp{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.25);box-shadow:0 3px 0 rgba(0,0,0,.4)}
/* picross */
.pxw{display:flex;justify-content:center}
.pxg{display:grid;gap:3px}
.pxc{display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--dim);white-space:pre-line;line-height:1.1;min-width:26px}
.pxc.side{justify-content:end;padding-right:5px;white-space:nowrap}
.gc.px{width:44px;height:44px;background:var(--panel2);font-size:16px;color:var(--bad)}
.gc.px.fill{background:var(--lime)}
.gc.px.x{background:var(--panel)}
/* hanoi */
.hnw{display:flex;gap:10px;justify-content:center;align-items:flex-end;min-height:210px}
.hnp{flex:1;max-width:120px;cursor:pointer;padding:6px 4px 0;border-radius:12px;transition:background .15s;position:relative}
.hnrod{position:absolute;left:50%;bottom:24px;width:7px;height:170px;margin-left:-3.5px;border-radius:4px;
  background:linear-gradient(180deg,var(--edge),#2a1741)}
.hnp.goal .hnrod{background:linear-gradient(180deg,var(--lime),#4a6b12);opacity:.65}
.hnlbl{text-align:center;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--dim);margin-top:5px;height:12px}
.hnp.goal .hnlbl{color:var(--lime)}
.hnp.sel{background:rgba(255,176,46,.16);outline:2px solid var(--sun)}
.hns{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-height:170px;position:relative;z-index:1}
.hnd{height:26px;border-radius:7px;display:grid;place-items:center;font-weight:800;color:#180c26;font-size:13px;
  box-shadow:0 3px 0 rgba(0,0,0,.35)}
.hnbase{height:8px;border-radius:5px;background:var(--edge);margin-top:5px}
/* snake dpad */
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,46px);gap:6px;justify-content:center;margin-top:14px}
.dk{border-radius:12px;background:var(--panel2);border:1px solid var(--edge);font-size:20px;font-weight:800}
.dpad .dk:nth-child(1){grid-column:2;grid-row:1}
.dpad .dk:nth-child(2){grid-column:1;grid-row:2}
.dpad .dk:nth-child(3){grid-column:2;grid-row:2}
.dpad .dk:nth-child(4){grid-column:3;grid-row:2}
/* aim */
.aimw{position:relative;height:330px;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#3a1030,#1b0a1a);touch-action:none}
.aimt{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9ec8,#ff2f87 60%,#8d0f45);
  box-shadow:0 0 18px #ff2f8788;cursor:pointer}
/* stroop */
.stw{font-family:var(--display);font-size:clamp(40px,13vw,74px);text-align:center;letter-spacing:.02em;
  text-shadow:0 4px 0 rgba(0,0,0,.35);margin-top:6px}
.stopts{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:360px;margin:0 auto}
.stb{padding:15px 8px;border-radius:13px;font-weight:800;color:#160b25;font-size:15px;
  border:2px solid rgba(255,255,255,.25);box-shadow:0 4px 0 rgba(0,0,0,.4)}
/* chimp */
.chg{max-width:360px;margin:0 auto;gap:5px}
.gc.ch{aspect-ratio:1;background:transparent;border-color:transparent;cursor:default;font-size:17px}
.gc.ch.has{background:var(--panel2);border-color:var(--edge);cursor:pointer}
.gc.ch.blank{background:var(--violet)}
.gc.ch.gone{background:transparent;border-color:transparent}
/* math */
.mbq{font-family:var(--display);font-size:clamp(38px,12vw,64px);text-align:center;margin:10px 0 16px;color:var(--sun)}
.mbo{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:360px;margin:0 auto}
.mbb{padding:17px 8px;border-radius:13px;background:var(--panel2);border:1px solid var(--edge);
  font-family:var(--display);font-size:24px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.mbb.no{background:var(--bad)}
/* reaction */
.rxp{height:260px;border-radius:16px;display:grid;place-items:center;cursor:pointer;user-select:none;
  background:var(--panel2);transition:background .12s;text-align:center}
.rxp.wait{background:#8d2f2f} .rxp.go{background:var(--ok)} .rxp.early{background:#6b2340} .rxp.ok{background:var(--panel2)}
.rxt{font-family:var(--display);font-size:clamp(32px,10vw,54px)}
.rxs{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px}
/* hub search */
.searchwrap{position:relative;margin:4px 0 18px}
#gsearch{width:100%;padding:14px 44px 14px 44px;border-radius:14px;background:var(--panel);
  border:2px solid var(--edge);color:var(--ice);font-family:var(--ui);font-size:16px;font-weight:600}
#gsearch:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,228,255,.16)}
.searchwrap .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.7}
.searchwrap .sx{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  border-radius:50%;background:var(--panel2);border:1px solid var(--edge);display:none;place-items:center}
.searchwrap.has .sx{display:grid}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:-8px 0 16px}
.fchip{padding:7px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--edge);
  font-size:13px;font-weight:700;color:var(--dim)}
.fchip.on{background:var(--cyan);color:#10202a;border-color:var(--cyan)}
.nores{text-align:center;padding:30px 10px;color:var(--dim)}
.nores b{font-family:var(--display);font-size:22px;color:var(--ice);display:block;margin-bottom:6px}


/* ---------- toy widgets ---------- */
.tools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.tool{padding:9px 13px;border-radius:11px;background:var(--panel);border:2px solid var(--edge);
  font-size:13px;font-weight:700;color:var(--dim)}
.tool.on{border-color:var(--tc,var(--cyan));color:var(--ice);background:var(--panel2);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--tc,#22e4ff) 22%,transparent)}
.blg{display:grid;gap:3px;max-width:380px;margin:0 auto}
.blc{aspect-ratio:1;border-radius:5px;background:var(--panel2);border:1px solid var(--edge);
  cursor:pointer;transition:transform .09s,background .12s,box-shadow .15s}
.blc:active{transform:scale(.88)}
.blc.beat{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.blc.on{border-color:transparent}
.blc.hitpop{animation:blpop .32s ease-out}
@keyframes blpop{0%{transform:scale(1)}35%{transform:scale(1.55);filter:brightness(1.8)}100%{transform:scale(1)}}


.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px;margin-top:12px}
.mat{display:flex;align-items:center;gap:6px;padding:9px 8px;border-radius:10px;background:var(--panel);
  border:2px solid var(--edge);font-size:12px;font-weight:700;color:var(--dim);text-align:left}
.mat .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 7px currentColor}
.mat.on{color:var(--ice);background:var(--panel2);border-color:var(--mc)}
.brush{display:flex;align-items:center;gap:11px;margin-top:11px;padding:0 4px}
.brush input[type=range]{flex:1;accent-color:var(--sun);height:22px}
.brush b{font-family:var(--display);font-size:17px;min-width:24px;text-align:right;color:var(--sun)}

@media (max-width:420px){
  .wrow{grid-template-columns:repeat(5,minmax(0,46px))}
  .sq{grid-template-columns:repeat(5,minmax(0,48px))}
  .sud{grid-template-columns:repeat(6,minmax(0,44px))}
  .key{min-width:26px;height:42px;padding:0 4px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.05ms !important}
}
</style>
</head>
<body>
<canvas id="fxc"></canvas>
<div id="flash"></div>

<div id="levelup"><div>LEVEL UP<small id="luSub">Level 4</small></div></div>
<div id="toasts"></div>
<div id="popups"></div>
<div id="app">
  <div class="topbar">
    <div class="lvl">
      <svg width="46" height="46" viewBox="0 0 46 46">
        <circle cx="23" cy="23" r="19" fill="none" stroke="#2a1741" stroke-width="5"/>
        <circle id="ring" cx="23" cy="23" r="19" fill="none" stroke="url(#gr)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4"/>
        <defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e4ff"/><stop offset="1" stop-color="#b8ff3c"/></linearGradient></defs>
      </svg>
      <b id="lvlNum">1</b>
    </div>
    <div class="xpwrap">
      <div class="xpline"><b id="xpTitle">Warming up</b><span id="xpText">0 / 100 XP</span></div>
      <div class="bar"><i id="xpBar"></i></div>
    </div>
    <div class="chip" title="Coins">🪙<b id="coins">0</b></div>
    <button class="iconbtn" id="adBtn" aria-label="Toggle scam popups" title="Scam popups">🛡</button>

        k.onclick = () => type(ch === '↵' ? 'Enter' : ch === '⌫' ? 'Backspace' : ch);

    });
    let answer, guesses, cur, over, busy = false, shown = 0;
    const cells = [];
    function build() {
      grid.innerHTML = ''; cells.length = 0;
      for (let r = 0; r < 6; r++) {
        const row = el('div', 'wrow'); const cr = [];
        for (let c = 0; c < 5; c++) { const cc = el('div', 'cell'); row.appendChild(cc); cr.push(cc); }
        grid.appendChild(row); cells.push(cr);
      }
    }
    function newWord() {
      answer = pick(DATA.answers); guesses = []; cur = ''; over = false; busy = false; shown = 0;
      build(); msg.textContent = ''; sb.set('left', 6);
      Object.values(keyEls).forEach(k => k.className = 'key');
    }
    function paint() {
      const r = guesses.length;
      if (r > 5) return;
      guesses.slice(0, shown).forEach((gw, gi) => {
        const res = score(gw);
        for (let c = 0; c < 5; c++) {
          const cc = cells[gi][c];
          if (cc.textContent !== gw[c]) { cc.textContent = gw[c]; cc.className = 'cell ' + res[c]; }
        }
      });
      for (let c = 0; c < 5; c++) {
        const cc = cells[r][c];

        cc.className = 'cell' + (cur[c] ? ' f' : '');

    function score(guess) {
      const res = Array(5).fill('n'), pool = {};
      for (let i = 0; i < 5; i++) if (guess[i] !== answer[i]) pool[answer[i]] = (pool[answer[i]] || 0) + 1;
      for (let i = 0; i < 5; i++) {
        if (guess[i] === answer[i]) res[i] = 'g';
        else if (pool[guess[i]]) { res[i] = 'y'; pool[guess[i]]--; }
      }

      busy = true;

          if (v === 'g') FX.burstAt(cc, 8, ['#b8ff3c']);
        }, i * 160);
      });
      guesses.push(g);
      const won = res.every(v => v === 'g');
      cur = '';
      sb.set('left', 6 - guesses.length);
      later(() => {
        shown = guesses.length; busy = false;
        if (won) {
          over = true; chain++;
          sb.set('chain', chain, true);
          if (chain > best) { best = chain; sb.set('best', best); }
          setBest('wordrush', chain);
          const mult = hit(2);

          msg.textContent = guesses.length === 1 ? 'Absurd.' : guesses.length <= 3 ? 'Clean solve.' : 'Got there.';
          award(pts, 10 + (7 - guesses.length) * 3);
          later(() => { newWord(); paint(); }, 1300);
        } else if (guesses.length === 6) {
          over = true; breakCombo(); SFX.lose(); FX.shake(grid); buzz(120);
          msg.innerHTML = 'It was <b style="color:var(--lime)">' + answer.toUpperCase() + '</b>';
          chain = 0; sb.set('chain', 0);
          later(() => { newWord(); paint(); }, 2100);
        }
      }, 900);
    }
    function type(k) {
      if (over || busy) return;
      if (k === 'Enter') return submit();
      if (k === 'Backspace') { cur = cur.slice(0, -1); SFX.tap(); return paint(); }
      if (/^[a-zA-Z]$/.test(k) && cur.length < 5) {
        cur += k.toLowerCase(); SFX.blip(cur.length); paint();
        const cc = cells[guesses.length][cur.length - 1]; FX.pop(cc);
      }
    }
    keyHandler(e => { if (e.metaKey || e.ctrlKey) return; type(e.key); });
    newWord(); paint();
  }
});

    }

    function matches() {
      const out = new Set();
      for (let r = 0; r < N; r++) for (let c = 0; c < N - 2; c++) {
        const v = at(r, c); if (v == null) continue;
        let k = c; while (k + 1 < N && at(r, k + 1) === v) k++;
        if (k - c >= 2) { for (let j = c; j <= k; j++) out.add(r * N + j); c = k; }
      }
      for (let c = 0; c < N; c++) for (let r = 0; r < N - 2; r++) {
        const v = at(r, c); if (v == null) continue;
        let k = r; while (k + 1 < N && at(k + 1, c) === v) k++;
        if (k - r >= 2) { for (let j = r; j <= k; j++) out.add(j * N + c); r = k; }
      }
      return [...out];
    }
    function fill() {
      b2 = Array.from({ length: N * N }, () => rnd(G.length));
      let guard = 0;
      while (matches().length && guard++ < 200) matches().forEach(i => b2[i] = rnd(G.length));
    }

      cells.forEach((d, i) => {
        const v = b2[i];

      sb.set('s', score, true);
      award(Math.round(gain / 2), depth > 1 ? 5 : 1, false);
      if (score > (S.best.gems || 0)) { S.best.gems = score; save(); sb.set('b', score); }
      later(() => {

        for (let c = 0; c < N; c++) {
          const col = [];
          for (let r = N - 1; r >= 0; r--) if (b2[r * N + c] != null) col.push(b2[r * N + c]);
          for (let r = N - 1; r >= 0; r--) {
            const v = col[N - 1 - r];

            else b2[r * N + c] = v;
          }
        }
        paint(fresh);
        later(() => resolve(depth + 1), 180);
      }, 190);
    }
    function end() {
      SFX.win(); FX.confetti(150);
      award(Math.round(score / 4), Math.round(score / 25));

            words.push({ w, r, c, d }); placed = true;
          }
          if (placed) break;
        }
      }
      const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

      const len = Math.max(Math.abs(b2.r - a.r), Math.abs(b2.c - a.c)) + 1;
      if (dr !== 0 && dc !== 0 && Math.abs(b2.r - a.r) !== Math.abs(b2.c - a.c)) return null;
      const out = [];

GAMES.push({

  sub: 'Eat, grow, do not bite yourself.',

  mount(root) {

    const pad = el('div', 'dpad');
    [['↑', [0, -1]], ['←', [-1, 0]], ['↓', [0, 1]], ['→', [1, 0]]].forEach(([t, d]) => {
      const k = el('button', 'dk', t); k.onclick = () => turn(d); pad.appendChild(k);
    });
    b.appendChild(pad);

    function reset() {
      snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
      dir = { x: 1, y: 0 }; nextDir = dir; score = 0; dead = false; speed = 130; started = false;
      dropFood(); sb.set('s', 0); sb.set('l', 3);
      msg.style.display = ''; msg.textContent = 'Swipe or press an arrow to start';
      draw();
    }
    function dropFood() {
      let f;
      do { f = { x: rnd(N), y: rnd(N) }; } while (snake.some(s => s.x === f.x && s.y === f.y));
      food = f;
    }
    function turn(d) {
      if (dead) return;
      if (d[0] === -dir.x && d[1] === -dir.y) return;
      nextDir = { x: d[0], y: d[1] };
      if (!started) { started = true; msg.style.display = 'none'; run(); }
    }
    function step() {
      dir = nextDir;
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (h.x < 0 || h.x >= N || h.y < 0 || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) return die();
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) {
        score += 10; sb.set('s', score, true); sb.set('l', snake.length);
        SFX.good(Math.min(snake.length - 3, 10)); hit(); award(14, 2, false); buzz(10);
        FX.burstAt(cv, 10, ['#b8ff3c', '#fff']);
        speed = Math.max(60, speed - 3);
        clearInterval(tick); tick = timerLoop(step, speed);
        dropFood();
      } else snake.pop();
      draw();
    }
    function die() {
      dead = true; clearInterval(tick);
      SFX.lose(); FX.shake(cv); breakCombo(); buzz([30, 50, 30]);
      setBest('snake', score); sb.set('b', S.best.snake);
      award(Math.round(score / 2), Math.round(score / 6), 'Snake down');

        () => { p.remove(); reset(); });
    }
    function draw() {
      c2.clearRect(0, 0, W, W);
      c2.fillStyle = 'rgba(255,255,255,.04)';
      for (let i = 0; i < N; i += 2) for (let j = 0; j < N; j += 2) c2.fillRect(i * CELL, j * CELL, CELL, CELL);
      c2.fillStyle = '#ff2f87';
      c2.beginPath(); c2.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * .34, 0, 7); c2.fill();
      snake.forEach((s, i) => {
        const t = 1 - i / (snake.length + 4);
        c2.fillStyle = i === 0 ? '#e9ffb0' : 'rgba(184,255,60,' + (0.35 + t * 0.65) + ')';
        const p = 2;
        c2.beginPath();
        c2.roundRect(s.x * CELL + p, s.y * CELL + p, CELL - p * 2, CELL - p * 2, 5);
        c2.fill();
      });
    }
    function run() { clearInterval(tick); tick = timerLoop(step, speed); }
    keyHandler(e => {
      if ($('#view').dataset.at !== 'snake') return;
      const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
      const d = m[e.key];
      if (d) { e.preventDefault(); turn(d); }
    });
    let sx = 0, sy = 0;
    cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
    cv.addEventListener('pointerup', e => {
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      turn(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
    });
    onLeave(() => clearInterval(tick));
    reset();
  }
});

            for (const d of N4) {

              if (grid[idx(nx, ny)] === PLANT) kin++;

            if (kin < 3) {                       // vines creep, they don't carpet

                const nx = x + d[0], ny = y + d[1];
                if (nx < 0 || nx >= GW || ny < 0 || ny >= GH) continue;
                const j = idx(nx, ny);
                if (grid[j] === WATER && Math.random() < .0035) { grid[j] = PLANT; ex[j] = rnd(3); break; }
              }
            }
            continue;

          if (m === WOOD) continue;
          if (m === POW) {
            for (const d of N4) {
              const nx = x + d[0], ny = y + d[1];

              const o = grid[idx(nx, ny)];

          if (m === STEAM || m === SMOKE) {

              grid[i] = (m === STEAM && Math.random() < .4) ? WATER : E;
              ex[i] = rnd(3); continue;
            }
            if (y > 0 && moveTo(i, idx(x, y - 1))) continue;
            const nx = x + (Math.random() < .5 ? -1 : 1);
            if (nx >= 0 && nx < GW && y > 0 && grid[idx(nx, y - 1)] === E) { swapc(i, idx(nx, y - 1)); continue; }
            if (nx >= 0 && nx < GW && grid[idx(nx, y)] === E) swapc(i, idx(nx, y));

          let moved = false;
          for (const d of [dir, -dir]) {

          }

            for (let s = 1; s <= meta.disp; s++) {

/* shared helpers */
function sweepTone(f1, f2, dur, type, vol) {
  if (!S.sound) return; SFX.init(); if (!SFX.ctx) return;
  if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
  const t = SFX.ctx.currentTime, o = SFX.ctx.createOscillator(), g = SFX.ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(20, f1), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5 * (vol == null ? 1 : vol), t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(SFX.gain); o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur, vol, freq, q) {
  if (!S.sound) return; SFX.init(); if (!SFX.ctx) return;
  if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
  const ctx2 = SFX.ctx, n = Math.max(1, Math.floor(ctx2.sampleRate * dur));
  const buf = ctx2.createBuffer(1, n, ctx2.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = ctx2.createBufferSource(); src.buffer = buf;
  const f = ctx2.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = freq || 1200; f.Q.value = q || 0.9;
  const g = ctx2.createGain(); g.gain.value = vol == null ? 0.4 : vol;
  src.connect(f); f.connect(g); g.connect(SFX.gain); src.start();
}
function stage(root, W, H, bg) {
  const b = board(root); b.style.padding = '10px';
  const cv = el('canvas'); cv.width = W; cv.height = H;
  cv.style.cssText = 'width:100%;max-width:' + W + 'px;height:auto;display:block;margin:0 auto;' +
    'border-radius:14px;touch-action:none;background:' + bg;
  b.appendChild(cv);
  const c = cv.getContext('2d');
  const pos = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  };
  return { b, cv, c, pos };
}
function anim(fn) {
  let id = requestAnimationFrame(function step() { fn(); id = requestAnimationFrame(step); });
  onLeave(() => cancelAnimationFrame(id));
}
function makeDrip(xp, coin, every) {
  let n = 0, E = every || 8;
  return (k) => {
    n += (k || 1);
    while (n >= E) { n -= E; award(xp, coin, false); }
  };
}
function toolRow(b, items, initial, onPick) {
  const row = el('div', 'tools');
  const btns = items.map(it => {
    const t = el('button', 'tool', it.label);
    t.dataset.v = it.v;
    if (it.color) t.style.setProperty('--tc', it.color);
    t.onclick = () => {
      btns.forEach(x => x.classList.remove('on'));

    row.appendChild(t);

  });
  const start = btns.find(x => x.dataset.v == initial) || btns[0];
  if (start) start.classList.add('on');
  b.appendChild(row);
  return row;
}

  btn.id = 'juiceBtn'; btn.setAttribute('aria-label', 'Toggle effect intensity');
  $('.topbar').insertBefore(btn, $('#adBtn'));
  function paintJuice() {
    btn.textContent = S.juice === false ? '🌙' : '⚡';
    btn.title = S.juice === false ? 'Effects: calm' : 'Effects: maximum';
    if (S.juice === false) {
      glow.classList.remove('on'); aurora.style.opacity = '0';
      document.body.classList.remove('hot', 'inferno');
    } else setGlow();
  }
  btn.onclick = () => {
    S.juice = S.juice === false; save(); paintJuice();
    toast(S.juice === false ? 'Effects dialled back' : 'Maximum overdrive', S.juice === false ? '' : 'hot');
    if (S.juice !== false) { SFX.win(); FX.confetti(70); }
  };
  paintJuice();
  window.addEventListener('beforeunload', () => clearInterval(beatT));
})();
/* ============ boot ============ */
load();
paintHUD();
$('#sndBtn').onclick = () => {
  S.sound = !S.sound; save();
  $('#sndBtn').textContent = S.sound ? '🔊' : '🔇';
  if (S.sound) { SFX.init(); SFX.good(4); }
};
$('#sndBtn').textContent = S.sound ? '🔊' : '🔇';
function unlockAudio() {
  SFX.init();
  if (!SFX.ctx) return;
  if (SFX.ctx.state === 'suspended') SFX.ctx.resume();
  try {
    const b = SFX.ctx.createBuffer(1, 1, 22050);
    const s = SFX.ctx.createBufferSource();
    s.buffer = b; s.connect(SFX.ctx.destination); s.start(0);
  } catch (e) { }
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once: true, passive: true }));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
});
$('#adBtn').onclick = () => setAds(!adsOn());
$('#adBtn').textContent = adsOn() ? '🛡' : '🚫';
$('#adBtn').title = adsOn() ? 'Scam popups: on' : 'Scam popups: off';
if (adsOn()) scheduleAd(25000);
checkStreak();
const boot = location.hash.replace('#', '');
go(GAMES.find(g => g.id === boot) ? boot : 'hub');
</script>
